<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ebrahim Fadel — VHS Video Archive</title>
<meta name="description" content="A curved VHS-style video editing archive for Ebrahim Fadel.">
<style>
  :root{
    --paper:#f2eadb;
    --paper-2:#e8d8bf;
    --ink:#17130f;
    --muted:#756957;
    --cobalt:#1746a2;
    --blue:#2d65d8;
    --pink:#b600a8;
    --orange:#d9672b;
    --tape:#211c18;
    --shadow:rgba(28,20,12,.34);
    --vh:1vh;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;color:var(--ink);
    background:
      radial-gradient(circle at 14% 20%, rgba(23,70,162,.18) 0 1px, transparent 1.8px) 0 0/9px 9px,
      radial-gradient(circle at 84% 28%, rgba(182,0,168,.13) 0 1px, transparent 1.7px) 0 0/8px 8px,
      radial-gradient(circle at 50% 115%, rgba(217,103,43,.18), transparent 45%),
      linear-gradient(112deg, rgba(255,255,255,.58), transparent 38% 64%, rgba(74,47,19,.14)),
      var(--paper);
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;
    background-image:linear-gradient(90deg, rgba(0,0,0,.032) 1px, transparent 1px),linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px);
    background-size:42px 42px;mask-image:linear-gradient(to bottom, transparent, black 10% 88%, transparent);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;
    background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.24) 3px 4px);
    mix-blend-mode:soft-light;
  }
  .kanji{
    position:fixed;top:10vh;bottom:14vh;z-index:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
    color:transparent;-webkit-text-stroke:1px rgba(23,70,162,.24);
    font-family:"Arial Black", Impact, sans-serif;font-size:clamp(7rem,18vw,20rem);font-weight:900;letter-spacing:-.12em;line-height:.78;
    writing-mode:vertical-rl;text-orientation:upright;filter:contrast(1.25);opacity:.85;
  }
  .kanji::after{content:"";position:absolute;inset:0;background:radial-gradient(circle, rgba(23,70,162,.35) 0 1px, transparent 1.7px) 0 0/7px 7px;mix-blend-mode:screen}
  .kanji.left{left:-2vw;transform:rotate(180deg)}
  .kanji.right{right:-2vw;color:rgba(182,0,168,.06);-webkit-text-stroke:1px rgba(182,0,168,.23)}
  .page{position:relative;z-index:1;height:100vh;height:calc(var(--vh)*100);display:grid;grid-template-rows:auto 1fr;padding:clamp(14px,2vw,26px) clamp(18px,3vw,44px) clamp(14px,2vw,26px)}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:850}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{
    position:relative;flex:0 0 auto;width:48px;height:48px;border:2px solid var(--ink);border-radius:50%;
    background:radial-gradient(circle at 50% 50%, var(--paper) 0 8px, transparent 9px),var(--cobalt);color:var(--paper);
    box-shadow:4px 4px 0 var(--ink), inset 0 0 0 4px rgba(255,255,255,.14);
  }
  .brand-mark::before,.brand-mark::after{
    content:"";position:absolute;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--paper);
    box-shadow:inset 0 0 0 3px var(--cobalt);
  }
  .brand-mark::before{left:8px}.brand-mark::after{right:8px}
  .brand strong{display:block;font-size:13px;letter-spacing:.18em;white-space:nowrap}
  .brand span{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;margin-top:3px;white-space:nowrap}
  .archive-label{justify-self:center;text-align:center;color:var(--cobalt)}
  .archive-label b{display:block;font-family:"Arial Black",Impact,sans-serif;font-size:clamp(20px,3.4vw,38px);letter-spacing:.04em;line-height:.95}
  .archive-label span{display:block;margin-top:7px;color:var(--muted);font-size:10px;letter-spacing:.32em}
  .header-stamp{justify-self:end;display:grid;place-items:center;width:76px;height:76px;border:2px solid var(--pink);border-radius:50%;color:var(--pink);font-size:10px;font-weight:950;letter-spacing:.16em;text-align:center;transform:rotate(8deg);background:rgba(255,255,255,.16)}
  main{position:relative;min-height:0;display:grid;place-items:center}
  .shelf-wrap{position:relative;width:100%;height:min(72vh,690px);min-height:430px;perspective:1350px;perspective-origin:50% 60%;display:grid;place-items:end center}
  .floor{position:absolute;left:50%;bottom:11%;width:min(86vw,1080px);height:125px;transform:translateX(-50%);background:radial-gradient(ellipse at center, rgba(30,21,13,.34), rgba(30,21,13,.11) 48%, transparent 74%);filter:blur(2px)}
  .shelf-line{position:absolute;left:50%;bottom:14%;width:min(80vw,1010px);height:84px;transform:translateX(-50%);border-bottom:11px solid rgba(31,24,17,.92);border-radius:50%;box-shadow:0 13px 0 rgba(182,0,168,.18),0 25px 32px rgba(23,17,12,.16)}
  #shelf{position:absolute;inset:0;transform-style:preserve-3d}
  .tape{
    --w:58px;--h:284px;--x:0px;--y:0px;--z:0px;--ry:0deg;--s:1;
    position:absolute;left:50%;bottom:15%;width:var(--w);height:var(--h);border:0;padding:0;background:transparent;cursor:pointer;
    transform-style:preserve-3d;transform:translateX(calc(-50% + var(--x))) translateY(var(--y)) translateZ(var(--z)) rotateY(var(--ry)) scale(var(--s));
    will-change:transform;transition:filter .22s ease;
  }
  .tape .spine,.tape .cover{position:absolute;inset:0;border-radius:8px;overflow:hidden;background:var(--tape);border:1px solid rgba(0,0,0,.6);box-shadow:12px 18px 28px rgba(23,17,12,.3);backface-visibility:hidden}
  .tape .spine{
    display:flex;align-items:center;justify-content:center;
    background-image:linear-gradient(90deg, rgba(0,0,0,.78), rgba(0,0,0,.2) 43%, rgba(255,255,255,.28) 51%, rgba(0,0,0,.4)),var(--img);
    background-size:cover;background-position:center;clip-path:inset(0 0 0 0 round 8px);
  }
  .tape .spine::before{content:"";position:absolute;inset:10px 5px;border:1px solid rgba(255,255,255,.3);border-radius:5px;background:linear-gradient(90deg,transparent 47%,rgba(255,255,255,.18) 48% 52%,transparent 53%)}
  .tape .spine::after{content:attr(data-title);writing-mode:vertical-rl;text-orientation:mixed;color:#fff;font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase;text-shadow:0 2px 3px #000;max-height:88%;overflow:hidden}
  .tape .cover{
    transform:rotateY(0deg);background-image:linear-gradient(rgba(0,0,0,.02),rgba(0,0,0,.2)),var(--img);
    background-size:cover;background-position:center;clip-path:inset(0 100% 0 0 round 8px);
    box-shadow:16px 22px 34px rgba(23,17,12,.36);
  }
  .tape .cover::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.74);border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.24)}
  .tape .cover::after{content:"PLAY";position:absolute;left:13px;bottom:13px;padding:7px 9px;border-radius:5px;background:var(--paper);color:var(--cobalt);font-size:10px;font-weight:950;letter-spacing:.15em;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
  .tape.active{filter:saturate(1.16) contrast(1.06)}
  .tape.active .cover{animation:coverIn .52s cubic-bezier(.2,.84,.18,1) forwards}
  .tape.active .spine{animation:spineOut .34s cubic-bezier(.55,.06,.68,.19) forwards}
  .tape:not(.active) .cover{clip-path:inset(0 100% 0 0 round 8px)}
  @keyframes coverIn{from{clip-path:inset(0 100% 0 0 round 8px)}to{clip-path:inset(0 0 0 0 round 8px)}}
  @keyframes spineOut{from{clip-path:inset(0 0 0 0 round 8px)}to{clip-path:inset(0 0 0 100% round 8px)}}
  .caption{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:min(94vw,820px);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;z-index:5}
  .arrow{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);color:var(--cobalt);font-size:27px;font-weight:950;cursor:pointer;box-shadow:4px 4px 0 rgba(23,19,15,.24)}
  .arrow:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(23,19,15,.28)}
  .title-box{text-align:center;min-width:0}
  .title-box h1{margin:0;color:var(--cobalt);font-family:"Arial Black",Impact,sans-serif;font-size:clamp(27px,5.8vw,72px);line-height:.92;text-transform:uppercase;letter-spacing:-.045em;text-shadow:2px 2px 0 rgba(255,255,255,.44)}
  .title-meta{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px;color:var(--muted);font-size:11px;font-weight:950;letter-spacing:.22em;text-transform:uppercase}
  .rule{height:2px;background:var(--cobalt);width:58px}
  .timeline{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);width:min(84vw,880px);height:54px;pointer-events:none}
  .timeline-track{position:absolute;left:0;right:0;bottom:10px;border-top:3px solid var(--ink)}
  .tick{display:none;position:absolute;top:-3px;width:2px;height:12px;background:var(--ink)}
  .tick small{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:950;color:var(--muted);letter-spacing:.12em}
  .dot{position:absolute;top:-10px;left:0;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--cobalt);border:3px solid var(--paper);box-shadow:0 0 0 2px var(--cobalt),4px 5px 0 rgba(23,19,15,.2);will-change:transform}
  .detail{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:rgba(18,14,10,.42);backdrop-filter:blur(3px);pointer-events:none;visibility:hidden}
  .detail.open{pointer-events:auto;visibility:visible}
  .sheet{width:min(94vw,760px);max-height:92vh;overflow:auto;background:radial-gradient(circle at 20% 10%, rgba(23,70,162,.1) 0 1px, transparent 1.6px) 0 0/8px 8px,var(--paper);border:2px solid var(--ink);box-shadow:15px 15px 0 rgba(23,19,15,.38);padding:clamp(16px,3vw,30px);clip-path:inset(0 100% 0 0)}
  .detail.open .sheet{animation:sheetIn .5s cubic-bezier(.2,.84,.18,1) forwards}
  .detail.closing .sheet{animation:sheetOut .3s cubic-bezier(.55,.06,.68,.19) forwards}
  @keyframes sheetIn{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes sheetOut{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 100% 0 0)}}
  .sheet-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
  .sheet h2{margin:0;color:var(--cobalt);font-family:"Arial Black",Impact,sans-serif;font-size:clamp(28px,5vw,56px);line-height:.94;text-transform:uppercase;letter-spacing:-.04em}
  .sheet-head p{margin:9px 0 0;color:var(--muted);font-weight:900;letter-spacing:.18em;text-transform:uppercase;font-size:11px}
  .close{border:2px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer;box-shadow:3px 3px 0 rgba(23,19,15,.22)}
  .video-frame{position:relative;border:2px solid var(--ink);background:#050505;box-shadow:9px 9px 0 rgba(23,19,15,.22);aspect-ratio:9/16;overflow:hidden;max-height:70vh;margin:0 auto}
  .video-frame video{width:100%;height:100%;object-fit:cover;display:block}
  .ink-wash{position:absolute;inset:0;background:var(--cobalt);mix-blend-mode:multiply;clip-path:inset(0 0 0 100%);pointer-events:none}
  .detail.open .ink-wash{animation:inkIn .72s .1s cubic-bezier(.2,.84,.18,1) forwards}
  @keyframes inkIn{0%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:11;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:999px;font-size:11px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;clip-path:inset(0 100% 0 0 round 999px);transition:clip-path .25s ease}
  .toast.show{clip-path:inset(0 0 0 0 round 999px)}
  @media (max-width:900px){
    body{overflow:auto}
    .page{min-height:100vh;height:auto;grid-template-rows:auto 1fr}
    header{grid-template-columns:1fr auto}
    .archive-label{display:none}
    .header-stamp{width:66px;height:66px;font-size:9px}
    .brand-mark{width:44px;height:44px}
    .brand strong{font-size:12px;letter-spacing:.14em}
    .brand span{font-size:9px;letter-spacing:.14em}
    .shelf-wrap{height:66vh;min-height:500px}
    .kanji{opacity:.42}
    .caption{grid-template-columns:48px 1fr 48px;gap:10px}
    .arrow{width:48px;height:48px}
    .timeline{bottom:-20px;width:94vw}
    .sheet{width:min(94vw,480px);padding:16px}
    .video-frame{max-width:360px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <div class="kanji left" aria-hidden="true">فيديو</div>
  <div class="kanji right" aria-hidden="true">إبراهيم</div>
  <div class="page">
    <header>
      <div class="brand" aria-label="Ebrahim Fadel">
        <div class="brand-mark" aria-hidden="true"></div>
        <div><strong>Ebrahim Fadel</strong><span>Video Editor</span></div>
      </div>
      <div class="archive-label"><b>VHS Archive</b><span>Selected work</span></div>
      <div class="header-stamp" aria-hidden="true">15<br>tapes</div>
    </header>
    <main>
      <section class="shelf-wrap" aria-label="Video archive shelf">
        <div class="floor"></div>
        <div class="shelf-line"></div>
        <div id="shelf"></div>
        <div class="caption">
          <button class="arrow" id="prev" aria-label="Previous tape">‹</button>
          <div class="title-box"><h1 id="title">Car Hook Reel</h1><div class="title-meta"><span id="index">Tape 01</span><span class="rule"></span><span>Press play</span></div></div>
          <button class="arrow" id="next" aria-label="Next tape">›</button>
        </div>
        <div class="timeline" aria-hidden="true"><div class="timeline-track" id="timelineTrack"><div class="dot" id="dot"></div></div></div>
      </section>
    </main>
  </div>
  <div class="detail" id="detail" aria-hidden="true">
    <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><div><h2 id="sheetTitle">Car Hook Reel</h2><p id="sheetMeta">Tape 01</p></div><button class="close" id="close" aria-label="Close video">×</button></div>
      <div class="video-frame"><video id="player" controls playsinline preload="metadata"></video><div class="ink-wash"></div></div>
    </article>
  </div>
  <div class="toast" id="toast">Tap the front cover to open the tape</div>
<script>
const tapes = [
  {title:"Car Hook Reel", src:"/video/17-car-hook-reel.mp4", poster:"/video/1-17-car-hook-reel.jpg"},
  {title:"Interior Showcase", src:"/video/20-interior-showcase-basma.mp4", poster:"/video/2-20-interior-showcase-basma.jpg"},
  {title:"Shahenda Reel #1", src:"/video/4-shahenda-reel-1.mp4", poster:"/video/3-4-shahenda-reel-1.jpg"},
  {title:"Shahenda Reel #2", src:"/video/5-shahenda-reel-2.mp4", poster:"/video/4-5-shahenda-reel-2.jpg"},
  {title:"Doaa Book Review", src:"/video/21-doaa-book-review.mp4", poster:"/video/5-21-doaa-book-review.jpg"},
  {title:"Doaa Talk", src:"/video/7-doaa-talk.mp4", poster:"/video/6-7-doaa-talk.jpg"},
  {title:"Coach Fatma Review #1", src:"/video/8-fatma-review-1.mp4", poster:"/video/7-8-fatma-review-1.jpg"},
  {title:"Coach Fatma Review #2", src:"/video/9-fatma-review-2.mp4", poster:"/video/8-9-fatma-review-2.jpg"},
  {title:"Real Estate Ad", src:"/video/6-real-estate-ad.mp4", poster:"/video/9-6-real-estate-ad.jpg"},
  {title:"Yasmin Reel #1", src:"/video/10-yasmin-reel-1.mp4", poster:"/video/10-10-yasmin-reel-1.jpg"},
  {title:"Yasmin Reel #2", src:"/video/11-yasmin-reel-2.mp4", poster:"/video/11-11-yasmin-reel-2.jpg"},
  {title:"Yasmin Reel #3", src:"/video/12-yasmin-reel-3.mp4", poster:"/video/12-12-yasmin-reel-3.jpg"},
  {title:"Shahenda Reel #3", src:"/video/13-shahenda-reel-3.mp4", poster:"/video/13-13-shahenda-reel-3.jpg"},
  {title:"Doaa Reel #2", src:"/video/14-doaa-reel-2.mp4", poster:"/video/14-14-doaa-reel-2.jpg"},
  {title:"Coach Fatma Review #3", src:"/video/15-fatma-review-3.mp4", poster:"/video/15-15-fatma-review-3.jpg"}
];
const shelf = document.getElementById('shelf');
const titleEl = document.getElementById('title');
const indexEl = document.getElementById('index');
const dot = document.getElementById('dot');
const track = document.getElementById('timelineTrack');
const detail = document.getElementById('detail');
const sheetTitle = document.getElementById('sheetTitle');
const sheetMeta = document.getElementById('sheetMeta');
const player = document.getElementById('player');
const toast = document.getElementById('toast');
let active = 0;
let currentX = 0;
let targetX = 0;
let targets = [];
let states = [];
function pad(n){ return String(n+1).padStart(2,'0'); }
function build(){
  tapes.forEach((tape,i)=>{
    const b = document.createElement('button');
    b.className = 'tape';
    b.type = 'button';
    b.style.setProperty('--img', `url("${tape.poster}")`);
    b.setAttribute('aria-label', `Open ${tape.title}`);
    b.innerHTML = `<span class="spine" data-title="${tape.title}"></span><span class="cover"></span>`;
    b.addEventListener('click', () => { if(i === active) openDetail(); else { active = i; render(true); } });
    shelf.appendChild(b);
    states.push({x:0,y:0,z:0,ry:0,s:1});
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.left = `${(i/(tapes.length-1))*100}%`;
    tick.innerHTML = `<small>${pad(i)}</small>`;
    track.appendChild(tick);
  });
}
function measure(){
  const w = Math.min(window.innerWidth * .84, 1040);
  targets = tapes.map((_,i)=>{
    const off = i-active;
    const side = Math.sign(off);
    const abs = Math.abs(off);
    return {
      x: off * Math.min(66, w/15),
      y: abs * 9 - (abs === 0 ? 14 : 0),
      z: -abs * 58,
      ry: side * Math.min(38, 13 + abs * 5),
      s: Math.max(.6, 1 - abs * .056),
      active: off === 0
    };
  });
}
function render(announce){
  measure();
  [...shelf.children].forEach((el,i)=>{
    const p = targets[i];
    el.classList.toggle('active', p.active);
    el.style.setProperty('--w', p.active ? 'min(46vw,285px)' : '58px');
    el.style.setProperty('--h', p.active ? 'min(54vh,430px)' : '284px');
    el.style.zIndex = String(200 - Math.abs(i-active));
  });
  titleEl.textContent = tapes[active].title;
  indexEl.textContent = `Tape ${pad(active)} / ${pad(tapes.length-1)}`;
  targetX = (active/(tapes.length-1)) * (track.clientWidth || 1);
  if(announce){ toast.classList.add('show'); clearTimeout(render.t); render.t = setTimeout(()=>toast.classList.remove('show'), 1100); }
}
function frame(){
  currentX += (targetX-currentX) * .16;
  dot.style.transform = `translateX(${currentX}px)`;
  [...shelf.children].forEach((el,i)=>{
    const p = targets[i];
    const s = states[i];
    s.x += (p.x-s.x) * .13;
    s.y += (p.y-s.y) * .13;
    s.z += (p.z-s.z) * .13;
    s.ry += ((p.active ? 0 : p.ry)-s.ry) * .13;
    s.s += (p.s-s.s) * .13;
    const float = Math.sin(Date.now()/900 + i) * (p.active ? 1.1 : .38);
    el.style.setProperty('--x', `${s.x + float}px`);
    el.style.setProperty('--y', `${s.y}px`);
    el.style.setProperty('--z', `${s.z}px`);
    el.style.setProperty('--ry', `${s.ry}deg`);
    el.style.setProperty('--s', s.s);
  });
  requestAnimationFrame(frame);
}
function openDetail(){
  const tape = tapes[active];
  sheetTitle.textContent = tape.title;
  sheetMeta.textContent = `Tape ${pad(active)} / ${pad(tapes.length-1)}`;
  player.poster = tape.poster;
  player.src = tape.src;
  detail.classList.remove('closing');
  detail.classList.add('open');
  detail.setAttribute('aria-hidden','false');
}
function closeDetail(){
  if(!detail.classList.contains('open')) return;
  player.pause();
  detail.classList.add('closing');
  detail.setAttribute('aria-hidden','true');
  setTimeout(()=>{ detail.classList.remove('open','closing'); player.removeAttribute('src'); player.load(); }, 280);
}
document.getElementById('prev').addEventListener('click',()=>{active=(active-1+tapes.length)%tapes.length;render(true);});
document.getElementById('next').addEventListener('click',()=>{active=(active+1)%tapes.length;render(true);});
document.getElementById('close').addEventListener('click',closeDetail);
detail.addEventListener('click',e=>{if(e.target===detail)closeDetail();});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeDetail();
  if(e.key==='ArrowRight'){active=(active+1)%tapes.length;render(true);}
  if(e.key==='ArrowLeft'){active=(active-1+tapes.length)%tapes.length;render(true);}
});
window.addEventListener('resize',render);
build();render(false);requestAnimationFrame(frame);
</script>
</body>
</html>
