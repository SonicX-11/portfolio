function place(m){const w=innerWidth,h=innerHeight;let s,x,y;if(m==='hero'){s=Math.max(w/1440,h/810)*1.005;x=(w-1440*s)/2;y=(h-810*s)/2;}else{s=Math.max(w/1440,h/810)*1.01;x=(w-1440*s)/2;y=(h-810*s)/2;}frame.style.transform=`translate(${x}px,${y}px) scale(${s})`}

function heroIntro(){const opts={fill:'forwards',easing:'cubic-bezier(.16,1,.3,1)'};wordmark.animate([{opacity:0,transform:'translateY(28px) scale(.98)',clipPath:'inset(0 0 100% 0)'},{opacity:1,transform:'none',clipPath:'inset(0 0 0 0)'}],{duration:900,...opts});script.animate([{opacity:0,clipPath:'inset(0 100% 0 0)',transform:'rotate(-8deg)'},{opacity:1,clipPath:'inset(0 0 0 0)',transform:'rotate(-8deg)'}],{duration:900,delay:180,...opts});badge.animate([{opacity:0,transform:'translateY(-120%) rotate(8deg)'},{opacity:1,transform:'translateY(0) rotate(-3deg)',offset:.6},{transform:'none',opacity:1}],{duration:1050,delay:220,...opts}).onfinish=()=>{badge.animate([{transform:'rotate(-1.1deg)'},{transform:'rotate(1.1deg)'}],{duration:3200,iterations:Infinity,direction:'alternate',easing:'ease-in-out'})}}
function heroOut(){wordmark.animate([{transform:'translateY(-40px)',opacity:0}],{duration:380,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'});script.animate([{opacity:0}],{duration:300,fill:'forwards'});badge.animate([{transform:'translateY(-110%) rotate(-6deg)',opacity:0}],{duration:380,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'})}
function heroIn(){plate.style.visibility='visible';cut.animate([{opacity:0},{opacity:1}],{duration:500,fill:'forwards'});caseplate.animate([{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(12px)'}],{duration:800,easing:'cubic-bezier(.65,0,.35,1)',fill:'forwards'}).onfinish=()=>{caseplate.style.opacity=0};wordmark.animate([{opacity:0,transform:'translateY(-35px)',clipPath:'inset(0 0 100% 0)'},{opacity:1,transform:'none',clipPath:'inset(0 0 0 0)'}],{duration:700,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});script.animate([{opacity:0,clipPath:'inset(0 100% 0 0)'},{opacity:1,clipPath:'inset(0 0 0 0)'}],{duration:700,delay:120,fill:'forwards'});badge.animate([{opacity:0,transform:'translateY(-90%) rotate(-5deg)'},{opacity:1,transform:'none'}],{duration:750,delay:80,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'})}
function setScreen(on){screenEl.animate([{opacity:on?0:1},{opacity:on?1:0}],{duration:300,fill:'forwards'})}
function playFlash(p=.55,d=600){flash.animate([{opacity:0},{opacity:p,offset:.35},{opacity:0}],{duration:d,easing:'ease-out'})}
function fillCase(i){const c=cases[i];$('caseTitle').textContent=c.title;$('caseClient').textContent=c.client;$('caseCategory').textContent=c.category;$('caseYear').textContent=c.year;$('caseKey').textContent=c.key;$('caseText').textContent=c.text;$('caseNum').textContent=String(i+1).padStart(2,'0')+' / '+String(cases.length).padStart(2,'0');$('prevBtn').classList.toggle('dim',i===0)}
function caseIn(i,first){const delay=first?150:0;ticket.animate([{opacity:0,transform:'translateY(-60px) rotate(-6deg)'},{opacity:1,transform:'translateY(6px) rotate(1.2deg)',offset:.7},{opacity:1,transform:'none'}],{duration:800,delay,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'});[...desc.children].forEach((el,k)=>el.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:600,delay:(first?250:80)+k*70,easing:'cubic-bezier(.16,1,.3,1)',fill:'forwards'}))}
function caseOut(){ticket.animate([{opacity:0,transform:'translateY(-40px) rotate(4deg)'}],{duration:380,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'});[...desc.children].forEach((el,k)=>el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-10px)'}],{duration:300,delay:k*40,fill:'forwards'}))}
function playOnly(i){videos.forEach((v,k)=>{if(k===i){v.style.opacity=1;v.style.transform='none';v.play().catch(()=>{})}else{v.pause();try{v.currentTime=0}catch(e){}v.style.opacity=0}})}
function toCase(){if(busy||mode==='case')return;busy=true;document.body.classList.add('busy');heroOut();setTimeout(async()=>{frame.style.setProperty('--glide','1.6s');frame.classList.remove('glide');void frame.offsetWidth;frame.classList.add('glide');place('case');if(reduced||!transReady){caseplate.animate([{opacity:0},{opacity:1}],{duration:500,fill:'forwards'});setTimeout(arriveCase,520);return}trans.currentTime=0;trans.style.opacity=1;requestAnimationFrame(()=>requestAnimationFrame(()=>{plate.style.visibility='hidden';cut.animate([{opacity:1},{opacity:0}],{duration:260,easing:'ease-out',fill:'forwards'})}));const curve=()=>{if(!trans.duration)return;const p=trans.currentTime/trans.duration;trans.playbackRate=Math.max(1.2,1.8+2.4*Math.sin(Math.PI*Math.min(p*1.08,1)));if(p<.995&&!trans.ended&&mode==='hero')requestAnimationFrame(curve)};trans.play().catch(()=>{});curve();await new Promise(res=>{trans.onended=res;setTimeout(res,2300)});trans.pause();caseplate.style.opacity=1;trans.style.opacity=0;arriveCase()},330)}
function arriveCase(){mode='case';document.body.classList.add('is-case');setScreen(true);playFlash(.55,600);fillCase(0);videos[0].animate([{opacity:0,transform:'scale(1.06)'},{opacity:1,transform:'scale(1)'}],{duration:700,fill:'forwards'});playOnly(0);caseIn(0,true);videos[1].preload='auto';setTimeout(()=>{busy=false;document.body.classList.remove('busy');frame.classList.remove('glide')},700)}
function swapTo(n){if(busy||mode!=='case')return;busy=true;document.body.classList.add('busy');caseOut();videos[current].animate([{opacity:1},{opacity:0}],{duration:350,fill:'forwards'});setTimeout(()=>{videos[current].pause();playFlash(.35,420);current=(n+cases.length)%cases.length;fillCase(current);videos[current].animate([{opacity:0,transform:'scale(1.04)'},{opacity:1,transform:'scale(1)'}],{duration:500,fill:'forwards'});playOnly(current);caseIn(current,false);videos[(current+1)%cases.length].preload='auto';setTimeout(()=>{busy=false;document.body.classList.remove('busy')},520)},380)}
function toHero(){if(busy||mode!=='case')return;busy=true;document.body.classList.add('busy');caseOut();videos.forEach(v=>v.pause());setScreen(false);document.body.classList.remove('is-case');frame.style.setProperty('--glide','.9s');frame.classList.add('glide');place('hero');setTimeout(()=>{heroIn();mode='hero';setTimeout(()=>{busy=false;document.body.classList.remove('busy')},800)},250)}
$('portfolioBtn').onclick=toCase;$('studioBtn').onclick=toHero;$('logoBtn').onclick=toHero;$('nextBtn').onclick=()=>swapTo(current+1);$('prevBtn').onclick=()=>current===0?toHero():swapTo(current-1);$('screenHit').onclick=()=>swapTo(current+1);
let lock=false,tx=0,ty=0;
addEventListener('wheel',e=>{e.preventDefault();if(lock)return;lock=true;setTimeout(()=>lock=false,900);e.deltaY>18?(mode==='case'?swapTo(current+1):toCase()):(e.deltaY<-18&&(mode==='case'?(current===0?toHero():swapTo(current-1)):null))},{passive:false});
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>40){dy<0?(mode==='case'?swapTo(current+1):toCase()):(mode==='case'&&(current===0?toHero():swapTo(current-1)))}else if(Math.abs(dx)>40&&mode==='case'){dx<0?swapTo(current+1):(current===0?toHero():swapTo(current-1))}},{passive:true});
addEventListener('keydown',e=>{if(['ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();mode==='case'?swapTo(current+1):toCase()}if(['ArrowRight'].includes(e.key)&&mode==='case')swapTo(current+1);if(['ArrowUp','PageUp','ArrowLeft'].includes(e.key)&&mode==='case'){e.preventDefault();current===0?toHero():swapTo(current-1)}});
$('badgeHit').addEventListener('pointerenter',()=>{if(mode!=='hero')return;badge.animate([{transform:'rotate(0)'},{transform:'rotate(4deg)'},{transform:'rotate(-2deg)'},{transform:'none'}],{duration:900,easing:'cubic-bezier(.2,.8,.2,1)'})});
heroIntro();
})();
</script>
